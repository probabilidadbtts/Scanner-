name: Over 0.5 HT Scanner

on:
  schedule:
    - cron: "0 */2 * * *"    # cada 2 horas
  workflow_dispatch:
    inputs:
      competition_id:
        description: "Competition ID (opcional, ej: comp_3039)"
        required: false
        default: ""
      mode:
        description: "Modo: scan o backtest"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - backtest

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scanner
        if: github.event.inputs.mode != 'backtest'
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          COMPETITION_ID: ${{ github.event.inputs.competition_id }}
        run: python main.py

      - name: Ejecutar backtest
        if: github.event.inputs.mode == 'backtest'
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          COMPETITION_ID: ${{ github.event.inputs.competition_id }}
          MAX_MATCHES: "100"
        run: python backtest.py

      - name: Subir resultados backtest
        if: github.event.inputs.mode == 'backtest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.json
          if-no-files-found: ignore   
